[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Production builds run only from the release build hook (release.yml's
  # deploy-site job). Exit 0 skips the build: here, a production build with no
  # build-hook title. Deploy previews and branch deploys still build.
  # https://docs.netlify.com/build/configure-builds/ignore-builds
  # CONTEXT is production, deploy-preview, branch-deploy or dev;
  # INCOMING_HOOK_TITLE is set only on a build-hook build.
  # https://docs.netlify.com/build/configure-builds/environment-variables
  ignore = "test \"$CONTEXT\" = production && test -z \"$INCOMING_HOOK_TITLE\""

[functions]
  node_bundler = "esbuild"
